<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Inicio de sesión</title>
</head>
<body>
    <div class="login-container">
        <h2>Iniciar sesión</h2>
        <p>Introduzca su nombre de usuario y contraseña para autenticarse en el Portal Educativo.</p>
        <form action="admin.html" method="post">
            <label for="email">Usuario:</label>
            <input type="email" id="email" name="email" placeholder="usuario@correo.com" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="******" required>

            <button onclick="location.href='admin.html'" type="submit" class="inicio-sesion">Iniciar sesión</button>
            <button type="Login con Microsoft" class="inicio-sesion">Login con Microsoft</button>
        </form>
        <button onclick="location.href='index.html'" class="btn-login">Volver al inicio</button>
    </div>

    <footer class="pie">
        <p class="p3">&copy; Institución Educativa El Último Día. 2026</p>
    </footer>
</body>
</html>
