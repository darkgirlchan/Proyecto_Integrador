<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Registrarse</title>

</head>
<body>
     <div class="sinup-container">
    <h2>Crea una cuenta</h2>
    <form>
        <label for="Nombres">Nombres</label>
        <input type="text" name="Nombre" id="Nombre" required>
        <label for="Apellidos">Apellidos</label>
        <input type="text" name="Apellidos" id="Apellidos" required>
        <label for="Email">E-mail</label>
        <input type="text" name="Email" id="Email" required>
        <label for="Direccion">Dirección</label>
        <input type="text" name="Direccion" id="Direccion" required>
        <label for="Crear contraseña">Crear contraseña</label>
        <input type="text" name="Crear contraseña" id="Crear contraseña" required>
        <label for="Confirmar contraseña">Confirmar contraseña</label>
        <input type="text" name="Confirmar contraseña" id="Confirmar contraseña" required>

        <div>
        <input type="checkbox" name="Condiciones" id="Condiciones" required> 
         <label for="Condiciones">Acepto términos y condiciones </label>
        <button type="submit">Crear cuenta</button>
        </div>
    </form>
    </div>
</body>
</html>
