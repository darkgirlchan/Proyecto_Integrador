<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Inicio de sesión</title>
</head>
<body>
    <div class="login-container">
        <h2>Iniciar sesión</h2>
        <p>Introduzca su nombre de usuario y contraseña para autenticarse en el Portal Educativo.</p>
        <form action="admin.html" method="post">
            <label for="username">Usuario:</label>
            <input type="text" id="username" name="username" placeholder="usuario@correo.com" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="******" required>

            <button type="submit"><a href="admin.html">Iniciar sesión</a></button>

        <p>¿Ha olvidado su contraseña?</p>
        <button type="Login con Microsoft">Login con Microsoft</button>
        </form>
    </div>

</body>
<footer>
        <p>&copy; Institución Educativa El Último Día. 2026</p>
    </footer>
</html>
